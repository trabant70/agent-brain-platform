<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="1000" fill="#1e1e1e"/>

  <!-- Title -->
  <text x="700" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#cccccc">
    Agent Brain: Complete Knowledge Flow &amp; Learning Cycle
  </text>

  <!-- External Knowledge Sources (Top) -->
  <g id="external-sources">
    <!-- Organization -->
    <rect x="100" y="70" width="200" height="100" rx="10" fill="#2b2d45" stroke="#5c6bc0" stroke-width="2"/>
    <text x="200" y="95" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#7986cb">
      🏢 Organization
    </text>
    <text x="200" y="115" font-family="Arial" font-size="11" text-anchor="middle" fill="#cccccc">Mandates &amp; Standards</text>
    <text x="200" y="130" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">API Design v2.1</text>
    <text x="200" y="145" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">Security Requirements</text>
    <text x="200" y="160" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">🔒 Mandatory</text>

    <!-- Senior Developers -->
    <rect x="350" y="70" width="200" height="100" rx="10" fill="#332d40" stroke="#8561c5" stroke-width="2"/>
    <text x="450" y="95" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#9575cd">
      👩‍💻 Senior Developers
    </text>
    <text x="450" y="115" font-family="Arial" font-size="11" text-anchor="middle" fill="#cccccc">Domain Expertise</text>
    <text x="450" y="130" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">Migration Guides</text>
    <text x="450" y="145" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">Best Practices</text>
    <text x="450" y="160" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">⭐ Recommended</text>

    <!-- Community -->
    <rect x="600" y="70" width="200" height="100" rx="10" fill="#1a3330" stroke="#26a69a" stroke-width="2"/>
    <text x="700" y="95" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#4db6ac">
      🌐 Community
    </text>
    <text x="700" y="115" font-family="Arial" font-size="11" text-anchor="middle" fill="#cccccc">Shared Patterns</text>
    <text x="700" y="130" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">React Patterns</text>
    <text x="700" y="145" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">Testing Strategies</text>
    <text x="700" y="160" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">☑️ Optional</text>

    <!-- Marketplace -->
    <rect x="850" y="70" width="200" height="100" rx="10" fill="#3d2f1f" stroke="#ff8a50" stroke-width="2"/>
    <text x="950" y="95" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ff9d6c">
      🏪 Marketplace
    </text>
    <text x="950" y="115" font-family="Arial" font-size="11" text-anchor="middle" fill="#cccccc">Premium Packages</text>
    <text x="950" y="130" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">Industry Specific</text>
    <text x="950" y="145" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">Certified Expertise</text>
    <text x="950" y="160" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">💎 Purchasable</text>

    <!-- Multi-vendor box -->
    <rect x="1100" y="70" width="200" height="100" rx="10" fill="#3d2833" stroke="#d81b60" stroke-width="2"/>
    <text x="1200" y="95" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#e91e63">
      🤝 Vendor Teams
    </text>
    <text x="1200" y="115" font-family="Arial" font-size="11" text-anchor="middle" fill="#cccccc">Synchronized Standards</text>
    <text x="1200" y="130" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">Team A, B, C</text>
    <text x="1200" y="145" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">Shared Compliance</text>
    <text x="1200" y="160" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">📊 Coordinated</text>
  </g>

  <!-- Package Loading Zone -->
  <g id="package-loading">
    <rect x="350" y="200" width="700" height="80" rx="10" fill="#3d3a1f" stroke="#ffb74d" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="700" y="225" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffc107">
      📦 Knowledge System Loading
    </text>
    <text x="700" y="255" font-family="Arial" font-size="11" text-anchor="middle" fill="#cccccc">🔄 Flexible, 🧩 Composable, 🌱 Evolutionary</text>
  </g>

  <!-- Your Development (Left) and AI Coding Agent (Right) at same level -->
  <g id="main-actors">
    <!-- Your Development -->
    <rect x="50" y="320" width="280" height="180" rx="10" fill="#1f2d3d" stroke="#42a5f5" stroke-width="2"/>
    <text x="190" y="345" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#64b5f6">
      Your Development
    </text>

    <rect x="70" y="365" width="115" height="40" rx="5" fill="#2d2d2d" stroke="#42a5f5"/>
    <text x="127" y="385" font-family="Arial" font-size="11" text-anchor="middle" fill="#cccccc">💻 Code</text>
    <text x="127" y="400" font-family="Arial" font-size="9" text-anchor="middle" fill="#999999">Personal style</text>

    <rect x="195" y="365" width="115" height="40" rx="5" fill="#2d2d2d" stroke="#42a5f5"/>
    <text x="252" y="385" font-family="Arial" font-size="11" text-anchor="middle" fill="#cccccc">🐛 Debug</text>
    <text x="252" y="400" font-family="Arial" font-size="9" text-anchor="middle" fill="#999999">Learn from errors</text>

    <rect x="70" y="415" width="115" height="40" rx="5" fill="#2d2d2d" stroke="#42a5f5"/>
    <text x="127" y="435" font-family="Arial" font-size="11" text-anchor="middle" fill="#cccccc">🔄 Refactor</text>
    <text x="127" y="450" font-family="Arial" font-size="9" text-anchor="middle" fill="#999999">Improve patterns</text>

    <rect x="195" y="415" width="115" height="40" rx="5" fill="#2d2d2d" stroke="#42a5f5"/>
    <text x="252" y="435" font-family="Arial" font-size="11" text-anchor="middle" fill="#cccccc">📝 Sessions</text>
    <text x="252" y="450" font-family="Arial" font-size="9" text-anchor="middle" fill="#999999">Track progress</text>

    <text x="190" y="475" font-family="Arial" font-size="10" text-anchor="middle" fill="#999999">Git History • Commits • Evolution</text>

    <!-- AI Coding Agent -->
    <rect x="1070" y="320" width="280" height="180" rx="10" fill="#352840" stroke="#9c27b0" stroke-width="2"/>
    <text x="1210" y="345" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#ba68c8">
      AI Coding Agent
    </text>

    <rect x="1090" y="365" width="240" height="30" rx="5" fill="#2d2d2d" stroke="#9c27b0"/>
    <text x="1210" y="380" font-family="Arial" font-size="11" text-anchor="middle" fill="#cccccc">Receives customized guidance</text>
    <text x="1210" y="390" font-family="Arial" font-size="9" text-anchor="middle" fill="#999999">Context + Rules + Patterns</text>

    <rect x="1090" y="405" width="240" height="30" rx="5" fill="#2d2d2d" stroke="#9c27b0"/>
    <text x="1210" y="420" font-family="Arial" font-size="11" text-anchor="middle" fill="#cccccc">📋 Informed about org rules</text>
    <text x="1210" y="430" font-family="Arial" font-size="9" text-anchor="middle" fill="#999999">Standardized best practices</text>

    <rect x="1090" y="445" width="240" height="30" rx="5" fill="#2d2d2d" stroke="#9c27b0"/>
    <text x="1210" y="460" font-family="Arial" font-size="11" text-anchor="middle" fill="#cccccc">⭐ Informed by expert patterns</text>
    <text x="1210" y="470" font-family="Arial" font-size="9" text-anchor="middle" fill="#999999">Senior Developer recommended</text>
  </g>

  <!-- Retroactive Analysis (Left) and Prompt Enhancement (Right) below main actors -->
  <g id="processing">
    <!-- Concurrent Journaling -->
    <rect x="50" y="520" width="280" height="140" rx="10" fill="#1f3d21" stroke="#66bb6a" stroke-width="2"/>
    <text x="190" y="545" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#81c784">
      Concurrent Journaling
    </text>
    <text x="190" y="565" font-family="Arial" font-size="10" text-anchor="middle" fill="#cccccc">🔍 Discover Solutions</text>
    <text x="190" y="580" font-family="Arial" font-size="10" text-anchor="middle" fill="#cccccc">📝 Document Agent Sessions</text>
    <text x="190" y="595" font-family="Arial" font-size="10" text-anchor="middle" fill="#cccccc">💡 Creates Learnings</text>

    <rect x="70" y="615" width="240" height="25" rx="5" fill="#2d4d2f" stroke="#66bb6a"/>
    <text x="190" y="631" font-family="Arial" font-size="10" text-anchor="middle" fill="#cccccc">📤 Share discoveries with team</text>

    <!-- Coding Agent Guidance -->
    <rect x="1070" y="520" width="280" height="140" rx="10" fill="#3d2833" stroke="#d81b60" stroke-width="2"/>
    <text x="1210" y="545" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#e91e63">
      Coding Agent Guidance
    </text>
    <text x="1210" y="575" font-family="Arial" font-size="10" text-anchor="middle" fill="#cccccc">📝 Applies Injected Guidance</text>
    <text x="1210" y="595" font-family="Arial" font-size="10" text-anchor="middle" fill="#cccccc">🎯 Enhances Agent Self-Guidance</text>
    <text x="1210" y="615" font-family="Arial" font-size="10" text-anchor="middle" fill="#cccccc">🔧 Integrate Custom Solutions</text>
  </g>

  <!-- Central Knowledge System -->
  <g id="knowledge-system">
    <circle cx="700" cy="480" r="130" fill="#3d3a1f" stroke="#fb8c00" stroke-width="3"/>
    <text x="700" y="405" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle" fill="#ffa726">
      Knowledge System
    </text>

    <!-- Knowledge hierarchy layers -->
    <rect x="630" y="430" width="140" height="25" rx="5" fill="#4d2d1f" stroke="#ff7043"/>
    <text x="700" y="447" font-family="Arial" font-size="10" text-anchor="middle" fill="#cccccc">🔒 Organizational Rules</text>

    <rect x="630" y="460" width="140" height="25" rx="5" fill="#4d3920" stroke="#ffb74d"/>
    <text x="700" y="477" font-family="Arial" font-size="10" text-anchor="middle" fill="#cccccc">⭐ Expert Guidance</text>

    <rect x="630" y="490" width="140" height="25" rx="5" fill="#4d4520" stroke="#ffca28"/>
    <text x="700" y="507" font-family="Arial" font-size="10" text-anchor="middle" fill="#cccccc">👥 Team Patterns</text>

    <rect x="630" y="520" width="140" height="25" rx="5" fill="#3d4025" stroke="#9e9d24"/>
    <text x="700" y="537" font-family="Arial" font-size="10" text-anchor="middle" fill="#cccccc">💡 Personal Learnings</text>

    <rect x="630" y="550" width="140" height="25" rx="5" fill="#1f3d21" stroke="#66bb6a"/>
    <text x="700" y="567" font-family="Arial" font-size="10" text-anchor="middle" fill="#cccccc">🛤️ Golden Paths</text>
  </g>

  <!-- Knowledge Sharing Zone -->
  <g id="sharing">
    <rect x="400" y="630" width="600" height="60" rx="10" fill="#2b2d45" stroke="#7e57c2" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="700" y="650" font-family="Arial" font-size="12" font-weight="bold" text-anchor="middle" fill="#9575cd">
      🔄 Knowledge Sharing &amp; Distribution
    </text>
    <text x="550" y="670" font-family="Arial" font-size="10" text-anchor="middle" fill="#cccccc">📤 Export patterns</text>
    <text x="700" y="670" font-family="Arial" font-size="10" text-anchor="middle" fill="#cccccc">📦 Create packages</text>
    <text x="850" y="670" font-family="Arial" font-size="10" text-anchor="middle" fill="#cccccc">🏪 Publish to marketplace</text>
  </g>

  <!-- Timeline (Bottom) -->
  <g id="timeline">
    <rect x="400" y="780" width="600" height="120" rx="10" fill="#3d2f1f" stroke="#ff6e40" stroke-width="2"/>
    <text x="700" y="805" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle" fill="#ff8a65">
      Timeline Visualization
    </text>

    <line x1="450" y1="840" x2="950" y2="840" stroke="#ff8a65" stroke-width="2"/>

    <circle cx="500" cy="840" r="6" fill="#5c6bc0"/>
    <text x="500" y="860" font-family="Arial" font-size="9" text-anchor="middle" fill="#cccccc">Package</text>
    <text x="500" y="870" font-family="Arial" font-size="8" text-anchor="middle" fill="#999999">loaded</text>

    <circle cx="600" cy="840" r="6" fill="#66bb6a"/>
    <text x="600" y="860" font-family="Arial" font-size="9" text-anchor="middle" fill="#cccccc">Pattern</text>
    <text x="600" y="870" font-family="Arial" font-size="8" text-anchor="middle" fill="#999999">discovered</text>

    <circle cx="700" cy="840" r="6" fill="#ffb74d"/>
    <text x="700" y="860" font-family="Arial" font-size="9" text-anchor="middle" fill="#cccccc">Learning</text>
    <text x="700" y="870" font-family="Arial" font-size="8" text-anchor="middle" fill="#999999">created</text>

    <circle cx="800" cy="840" r="6" fill="#4db6ac"/>
    <text x="800" y="860" font-family="Arial" font-size="9" text-anchor="middle" fill="#cccccc">Shared</text>
    <text x="800" y="870" font-family="Arial" font-size="8" text-anchor="middle" fill="#999999">to team</text>

    <circle cx="900" cy="840" r="6" fill="#ba68c8"/>
    <text x="900" y="860" font-family="Arial" font-size="9" text-anchor="middle" fill="#cccccc">Insight</text>
    <text x="900" y="870" font-family="Arial" font-size="8" text-anchor="middle" fill="#999999">applied</text>
  </g>

  <!-- Flow Arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#999999"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#42a5f5"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#66bb6a"/>
    </marker>
  </defs>

  <!-- External to Package Loading -->
  <path d="M 200 170 L 400 200" stroke="#5c6bc0" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 450 170 L 500 200" stroke="#8561c5" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 700 170 L 700 200" stroke="#26a69a" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 950 170 L 900 200" stroke="#ff8a50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1200 170 L 1000 200" stroke="#d81b60" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Package Loading to Knowledge -->
  <path d="M 700 280 L 700 350" stroke="#ffc107" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Developer to Retro -->
  <path d="M 190 500 L 190 520" stroke="#42a5f5" stroke-width="2" fill="none" marker-end="url(#arrowhead-blue)"/>

  <!-- Retro to Knowledge -->
  <path d="M 330 590 L 570 480" stroke="#66bb6a" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
  <text x="400" y="530" font-family="Arial" font-size="10" fill="#81c784">discovers</text>

  <!-- Knowledge to Enhancement -->
  <path d="M 830 480 L 1070 590" stroke="#ffa726" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="950" y="530" font-family="Arial" font-size="10" fill="#999999">injects</text>

  <!-- Enhancement to AI -->
  <path d="M 1210 520 L 1210 500" stroke="#d81b60" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- AI to Developer -->
  <path d="M 1070 410 Q 700 250 330 410" stroke="#ba68c8" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="750" y="330" font-family="Arial" font-size="10" fill="#ba68c8">generates code</text>

  <!-- Knowledge to Sharing -->
  <path d="M 700 570 L 700 630" stroke="#7e57c2" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- The Complete Loop -->
  <ellipse cx="700" cy="470" rx="650" ry="350" fill="none" stroke="#66bb6a" stroke-width="3" stroke-dasharray="10,5" opacity="0.2"/>
  <text x="700" y="960" font-family="Arial" font-size="16" font-weight="bold" text-anchor="middle" fill="#66bb6a">
    Complete Knowledge Ecosystem: External Expertise + Personal Discovery + Community Sharing
  </text>
</svg>
