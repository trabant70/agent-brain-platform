<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repository Evolution Timeline</title>
    <!-- CSP will be injected by provider at runtime -->
</head>
<body>
    <div id="container">
        <!-- Tab Navigation -->
        <div id="tab-navigation">
            <button class="tab-button active" data-tab="timeline" aria-label="Timeline view" aria-selected="true">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="flex-shrink: 0;">
                    <path d="M1 3h14v2H1V3zm0 4h14v2H1V7zm0 4h14v2H1v-2z"/>
                </svg>
                Timeline
            </button>
            <button class="tab-button" data-tab="knowledge" aria-label="Knowledge Management view" aria-selected="false">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="flex-shrink: 0;">
                    <path d="M3 1h10c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2H3c-1.1 0-2-.9-2-2V3c0-1.1.9-2 2-2zm0 2v10h10V3H3zm2 2h6v1H5V5zm0 2h6v1H5V7zm0 2h4v1H5V9z"/>
                </svg>
                Knowledge
            </button>
        </div>

        <!-- Tab Contents -->
        <div id="tab-contents">
            <!-- Timeline Tab -->
            <div id="tab-timeline" class="tab-content active" aria-hidden="false">
                <!-- Statistics Panel and Control Center -->
                <div id="stats-bar">
                    <div class="stats-items">
                        <div class="stat-item" data-tooltip="Count of events currently displayed after applying filters"><span class="stat-label">Visible Events:</span><span class="stat-value" id="stat-visible">0</span></div>
                        <div class="stat-item" data-tooltip="Total count of all events in the repository, regardless of filters"><span class="stat-label">Total Events:</span><span class="stat-value" id="stat-total">0</span></div>
                        <div class="stat-item" data-tooltip="Number of unique authors who contributed to the currently visible events"><span class="stat-label">Contributors:</span><span class="stat-value" id="stat-contributors">0</span></div>
                        <div class="stat-item" data-tooltip="Count of branches with visible events (affected by filters)"><span class="stat-label">Active Branches:</span><span class="stat-value" id="stat-branches">0</span></div>
                        <div class="stat-item" data-tooltip="Time span in days between first and last visible event"><span class="stat-label">Window:</span><span class="stat-value" id="stat-window">-</span></div>
                        <div class="stat-item" data-tooltip="Development activity rate: events per day (higher = more frequent commits/changes)"><span class="stat-label">Velocity:</span><span class="stat-value" id="stat-velocity">0/day</span></div>
                    </div>
                    <button class="controls-trigger" id="controls-trigger" tabindex="0" role="button" aria-label="Toggle control panel">Controls</button>
                </div>

                <div id="timeline-container">
            <!-- Branch Timeline -->
            <div id="branch-timeline-container" class="timeline-main">
                <div id="visualization">
                    <svg id="main-svg"></svg>
                    <div class="tooltip" id="tooltip"></div>
                    <div class="toast" id="toast"></div>
                    <div class="connection-tooltip" id="connection-tooltip" style="display: none;">
                        <div class="connection-tooltip-content"></div>
                    </div>
                    <div class="event-popup" id="event-popup">
                        <button class="popup-close" id="popup-close">×</button>
                        <div class="popup-lock-indicator" id="popup-lock-indicator" title="Popup is locked - click outside or press Escape to close">📌</div>
                        <div class="popup-header">
                            <div class="popup-title-row">
                                <span class="popup-event-type" id="popup-event-type"></span>
                                <span class="popup-timestamp" id="popup-timestamp"></span>
                            </div>
                            <h3 class="popup-title" id="popup-title"></h3>
                            <div class="popup-tabs" id="popup-tabs" style="display: none;">
                                <div class="popup-tab active" data-tab="overview">Overview</div>
                                <div class="popup-tab" data-tab="impact">Impact</div>
                                <div class="popup-tab" data-tab="related">Related</div>
                                <div class="popup-tab" data-tab="technical">Technical</div>
                            </div>
                        </div>
                        <div class="popup-content" id="popup-content">
                            <div class="popup-tab-content active" id="tab-overview"></div>
                            <div class="popup-tab-content" id="tab-impact"></div>
                            <div class="popup-tab-content" id="tab-related"></div>
                            <div class="popup-tab-content" id="tab-technical"></div>
                        </div>
                        <div class="popup-action-bar" id="popup-action-bar"></div>
                    </div>
                    <div class="legend" id="timeline-legend">
                        <div class="legend-title">Legend</div>
                        <div class="legend-content">
                            <div id="legend-items"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

                <!-- BOTTOM: Range Selector (Slider + Bar Chart) - Part of timeline tab -->
                <div id="range-selector-section" class="range-selector-section">
                    <div id="range-selector" class="range-selector-container">
                        <svg id="range-svg"></svg>
                        <div class="range-label start" id="range-start-label">-</div>
                        <div class="range-label end" id="range-end-label">-</div>
                    </div>
                </div>
            </div>
            <!-- End Timeline Tab -->

            <!-- Knowledge Management Tab -->
            <div id="tab-knowledge" class="tab-content" aria-hidden="true">
                <div class="knowledge-container">
                    <!-- Left Panel: Claude.md Files -->
                    <div class="knowledge-left-panel">
                        <div class="panel-header">
                            <h3>📄 Claude.md Files</h3>
                            <button id="scan-claude-files" class="icon-button" title="Scan for claude.md files">🔍</button>
                        </div>
                        <div id="claude-files-accordion" class="accordion">
                            <div class="empty-state" style="padding: 20px; text-align: center;">
                                <div style="font-size: 24px; margin-bottom: 8px;">📄</div>
                                <div style="color: var(--vscode-descriptionForeground);">Click scan to find claude.md files</div>
                            </div>
                        </div>
                    </div>

                    <!-- Right Panel: Knowledge Items & Templates -->
                    <div class="knowledge-right-panel">
                        <!-- Search & Actions -->
                        <div class="knowledge-toolbar">
                            <input type="search" id="knowledge-search" placeholder="Search knowledge items..."/>
                            <div class="filter-chips" id="knowledge-filter-chips"></div>
                            <div class="grouping-controls">
                                <label>Group by:</label>
                                <button class="group-btn active" data-group="type" title="Group by knowledge type">Type</button>
                                <button class="group-btn" data-group="scope" title="Group by scope (Personal, Team, etc.)">Scope</button>
                                <button class="group-btn" data-group="tag" title="Group by tags">Tag</button>
                            </div>
                            <button id="refresh-knowledge" class="secondary-button" title="Refresh knowledge data">🔄 Refresh</button>
                            <button id="add-knowledge-item" class="primary-button">+ Add Item</button>
                            <button id="import-template" class="secondary-button">📥 Import</button>
                        </div>

                        <!-- Knowledge Table -->
                        <div class="knowledge-table-container">
                            <table id="knowledge-table" class="knowledge-table">
                                <thead>
                                    <tr>
                                        <th class="col-select">
                                            <input type="checkbox" id="knowledge-select-all"/>
                                            <button id="toggle-all-sections" class="toggle-all-btn" title="Expand/Collapse all sections">▼</button>
                                        </th>
                                        <th class="col-type" data-sort="type">Type</th>
                                        <th class="col-title" data-sort="title">Title</th>
                                        <th class="col-scope" data-sort="scope">Scope</th>
                                        <th class="col-tags">Tags</th>
                                        <th class="col-source">Source</th>
                                        <th class="col-actions">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="knowledge-items">
                                    <tr class="knowledge-empty-state">
                                        <td colspan="7" style="text-align: center; padding: 40px;">
                                            <div style="font-size: 48px; margin-bottom: 16px;">📚</div>
                                            <div style="font-size: 16px; color: var(--vscode-descriptionForeground);">
                                                Loading knowledge items...
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Template Controls -->
                        <div class="template-controls">
                            <div class="template-selection">
                                <label for="template-selector">Template:</label>
                                <select id="template-selector">
                                    <option value="">Select template...</option>
                                </select>
                            </div>
                            <div class="template-actions">
                                <button id="save-template" class="secondary-button" disabled>💾 Save Template</button>
                                <button id="apply-selected" class="primary-button" disabled>➕ Apply Selected Items</button>
                                <button id="apply-template" class="primary-button" disabled>📋 Apply Template</button>
                                <button id="export-template" class="secondary-button" disabled>📤 Export</button>
                            </div>
                        </div>

                        <!-- Status Bar -->
                        <div class="knowledge-status">
                            <span id="knowledge-status-text">Ready</span>
                            <span id="knowledge-item-count">0 items</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- End Tab Contents -->
    </div>

    <!-- Webpack will inject script tags here -->
</body>
</html>
